<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskflow - To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="header">
            <div>
                <p class="eyebrow">MY PRODUCTIVITY</p>
                <h1>TASK<span>FLOW</span></h1>
                <p class="subtitle">
                    Atur tugasmu, selesaikan satu per satu.
                </p>
            </div>
            <div class="date" id="today"></div>
        </header>

        <section class="input-card card">
            <input
                id="taskInput"
                type="text"
                placeholder="Tulis tugas baru..."
                maxlength="100"
            >
            <button id="addBtn">+ Tambah</button>
        </section>

        <section class="toolbar">
            <div class="stats">
                <span id="totalCount">0 tugas</span>
                <span id="doneCount">0 selesai</span>
            </div>
            <div class="filters">
                <button class="filter active" data-filter="all">Semua</button>
                <button class="filter" data-filter="active">Belum selesai</button>
                <button class="filter" data-filter="completed">Selesai</button>
            </div>
        </section>

        <ul id="taskList" class="task-list"></ul>

        <div id="emptyState" class="empty">
            <div class="empty-icon">✓</div>
            <h2>Belum ada tugas</h2>
            <p>
                Tambahkan tugas pertamamu di atas.
            </p>
        </div>

        <footer>
            <button id="clearCompleted" class="clear-btn">
                Hapus tugas yang selesai
            </button>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
