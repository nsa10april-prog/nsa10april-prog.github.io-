<!DOCTYPE html>
<html>
<head>
  <title>Cek Nilai Siswa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Cek Nilai Siswa</h1>
  <p class="subjudul">Aplikasi sederhana untuk menentukan grade dan status kelulusan</p>

  <div class="kotak">
    <label>Nama Siswa</label>
    <input type="text" id="nama" placeholder="Masukkan nama siswa">

    <label>Nilai Siswa</label>
    <input type="number" id="nilai" placeholder="0 - 100">

    <button onclick="cek()">Cek Nilai</button>
    <p class="error" id="error"></p>
  </div>

  <div class="kotak hasil" id="hasilBox">
    <h3>Hasil Penilaian</h3>
    <p>Nama: <span id="outNama">-</span></p>
    <p>Nilai: <span id="outNilai">-</span></p>
    <p>Grade: <span id="outGrade">-</span></p>
    <p>Status: <span id="outStatus">-</span></p>
  </div>

  <p class="footer">Tugas 2 - Dibuat sambil belajar </p>

  <script src="script.js"></script>
</body>
</html>
